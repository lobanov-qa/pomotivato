[project]
name = "pomotivato"
version = "0.0.0"
description = "Pomotivato desktop app — server process (API + static frontend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141,<1",
    "pydantic>=2.13,<3",
    "uvicorn>=0.52,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pomotivato"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/server/src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports/variables, undefined names
    "I",   # isort: import order
    "B",   # bugbear: likely bugs (loop variable capture, raise from, ...)
    "UP",  # pyupgrade: modern syntax for the pinned Python
    "SIM", # simplify
    "C4",  # comprehensions
    "PTH", # prefer pathlib
    "RET", # return-code hygiene
]

[tool.mypy]
python_version = "3.12"
mypy_path = "apps/server/src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
# test functions are untyped by pytest convention
disallow_untyped_defs = false
