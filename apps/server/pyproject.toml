[project]
name = "pomotivato"
version = "0.0.0"
description = "Pomotivato desktop app — server process (API + static frontend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141,<1",
    "pydantic>=2.13,<3",
    "uvicorn>=0.52,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "alembic>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pomotivato"]
