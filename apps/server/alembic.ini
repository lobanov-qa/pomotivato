# Alembic configuration for the pomotivato server package.
# The database URL is injected at runtime (pomotivato.infra.migrations) or
# read from POMOTIVATO_DB by alembic/env.py — never hardcoded here, so the
# same file works in dev, tests and packaged builds.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
