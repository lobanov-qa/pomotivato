[project]
name = "pomotivato-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "httpx>=0.28,<1",
    "ruff>=0.16,<1",
    "mypy>=2.3,<3",
    "pre-commit>=4.6,<5",
]

[tool.uv.workspace]
members = ["apps/server"]

# Tool configs live at the workspace root on purpose: ruff and mypy resolve
# their configuration from the invocation directory (repo root), NOT from
# the pyproject.toml nearest to each checked file. Putting [tool.*] into
# apps/server would silently downgrade both tools to defaults in CI.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/server/src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports/variables, undefined names
    "I",   # isort: import order
    "B",   # bugbear: likely bugs (loop variable capture, raise from, ...)
    "UP",  # pyupgrade: modern syntax for the pinned Python
    "SIM", # simplify
    "C4",  # comprehensions
    "PTH", # prefer pathlib
    "RET", # return-code hygiene
]

[tool.mypy]
python_version = "3.12"
mypy_path = "apps/server/src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
# test functions are untyped by pytest convention
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
markers = [
    "smoke: quick 'is it alive' checks (every PR)",
    "regression: full regression suite (main / nightly)",
    "unit: pure logic tests without HTTP or DB",
    "api: HTTP-level tests through the app",
    "e2e: Playwright browser tests",
    "property: hypothesis property-based tests",
    "contract: schemathesis OpenAPI contract tests",
    "quarantine: known-flaky, isolated from gating",
    "slow: excluded from PR-time runs",
]
