# Per-commit quality gates. Install once per clone:
#   uv run pre-commit install
# Run manually over everything:
#   uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies:
          - fastapi>=0.141
          - pydantic>=2.13
          - pytest>=9.1
        files: ^(apps/server/src|tests)/

  - repo: local
    hooks:
      - id: eslint-web
        name: eslint (apps/web)
        entry: pnpm -C apps/web lint
        language: system
        files: ^apps/web/
        pass_filenames: false
      - id: typecheck-web
        name: tsc --noEmit (apps/web)
        entry: pnpm -C apps/web typecheck
        language: system
        files: ^apps/web/
        pass_filenames: false
